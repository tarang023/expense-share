spring.application.name=expense_manager
spring.application.name=demo
server.port=8000

spring.datasource.url=${DATASOURCE_URL}

spring.datasource.username=${DATASOURCE_USER}

spring.datasource.password=${DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# 'update' automatically creates/updates tables without deleting data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
cors.allowed-origins=${FRONTEND_URL},${FRONTEND_URL_PROD}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cookie security: false for local HTTP dev, true in production (HTTPS on Render).
# Override in prod by setting the env var: APP_COOKIE_SECURE=true
app.cookie.secure=${APP_COOKIE_SECURE:false}
